name: parallax-risk
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parallax_risk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    image: parallax-risk:0.2.0
    environment:
      PARALLAX_ENVIRONMENT: production
      PARALLAX_DATABASE_URL: ${PARALLAX_DATABASE_URL:?Set PARALLAX_DATABASE_URL with host postgres}
      PARALLAX_LOG_LEVEL: INFO
      PARALLAX_DEFAULT_SEED: "0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
