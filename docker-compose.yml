name: parallax-risk
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parallax_risk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    image: parallax-risk:0.12.0
    environment:
      PARALLAX_ENVIRONMENT: production
      PARALLAX_DATABASE_URL: ${PARALLAX_DATABASE_URL:?Set PARALLAX_DATABASE_URL with host postgres}
      PARALLAX_LOG_LEVEL: INFO
      PARALLAX_DEFAULT_SEED: "0"
      PARALLAX_SERVICE_CREDENTIALS: ${PARALLAX_SERVICE_CREDENTIALS:?Set digest-only service credentials}
      PARALLAX_SERVICE_TRANSPORT: ${PARALLAX_SERVICE_TRANSPORT:-local}
      PARALLAX_SERVICE_ORIGINS: ${PARALLAX_SERVICE_ORIGINS:-[]}
      PARALLAX_SERVICE_WORKERS: ${PARALLAX_SERVICE_WORKERS:-1}
      PARALLAX_SERVICE_MAXIMUM_PENDING_JOBS: ${PARALLAX_SERVICE_MAXIMUM_PENDING_JOBS:-64}
      PARALLAX_SERVICE_MAXIMUM_PAYLOAD_BYTES: ${PARALLAX_SERVICE_MAXIMUM_PAYLOAD_BYTES:-1048576}
      PARALLAX_SERVICE_REQUESTS_PER_MINUTE: ${PARALLAX_SERVICE_REQUESTS_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
